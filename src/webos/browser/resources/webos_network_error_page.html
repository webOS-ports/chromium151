<!DOCTYPE html>
<!--
The main-frame network error page (IDR_WEBOS_NETWORK_ERROR_PAGE). The
renderer fills in the i18n placeholders, then appends errorCode, the viewport
size, the error_info dictionary and webos_network_error_page_template.js,
which builds the buttons (see webos_network_error_template_builder.cc).

Keep the placeholder syntax out of comments: ui::ReplaceTemplateExpressions
replaces it everywhere in the file, and CHECKs (crashing the renderer) on an
empty or unknown key.
-->
<html>
    <head>
        <meta charset="utf-8">
        <title>$i18n{error_details}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <link rel="stylesheet" href="webos_network_error_page.css">
    </head>
    <body id="t" onload="onload()">
        <div class="header" id="error_header">
            <h1 class="header-title" id="errortitle">$i18n{error_title}</h1>
            <span class="header-code" id="errorcode"></span>
        </div>
        <div class="content">
            <div class="group">
                <div class="group-inner">
                    <p class="row details" id="errordetails">$i18n{error_details}</p>
                    <p class="row guide" id="errorguide">$i18n{error_guide}</p>
                    <p class="row info" id="errorinfo">$i18n{error_info}</p>
                </div>
            </div>
            <div class="buttons" id="Button_Container"></div>
        </div>
    </body>
</html>
